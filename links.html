  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #0C306C;
      --blue-dark: #071B3D;
      --green: #B1CB4E;
      --whatsapp: #25D366;
      --yellow: #FCB017;
      --red: #DD3736;
      --orange: #F37021;
      --white: #FFFFFF;
      --body-font: 'Roboto', Arial, sans-serif;
      --condensed-font: 'Roboto Condensed', Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--body-font);
      color: #333;
      background: linear-gradient(160deg, var(--blue) 0%, var(--blue-dark) 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 48px 16px 32px;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .links-wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .links-logo img {
      height: 60px;
      width: auto;
    }

    .links-subtitle {
      margin-top: 18px;
      color: rgba(255, 255, 255, .75);
      font-family: var(--condensed-font);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }

    .links-list {
      width: 100%;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .97);
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .link-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
    }

    .link-item--cta {
      background: var(--yellow);
    }

    .link-icon {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--blue);
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
    }

    .link-icon--whatsapp {
      background: var(--whatsapp);
    }

    .link-icon--pin {
      background: var(--red);
    }

    .link-item--cta .link-icon {
      background: var(--blue);
    }

    .link-label {
      flex: 1 1 auto;
      font-family: var(--condensed-font);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      color: var(--blue);
      text-transform: uppercase;
      line-height: 1.25;
    }

    .link-arrow {
      flex: 0 0 auto;
      color: var(--blue);
      opacity: .5;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .links-footer {
      margin-top: 36px;
      color: rgba(255, 255, 255, .5);
      font-family: var(--condensed-font);
      font-size: 0.75rem;
      text-align: center;
    }

    @media (min-width: 480px) {
      .links-logo img {
        height: 72px;
      }

      .link-label {
        font-size: 1rem;
      }
    }
  </style>
</head>
